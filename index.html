<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <title>今日下班時間</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 20%, #202736 0%, #11151d 36%, #090b10 100%);
      color: #f7f8fb;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "PingFang TC", "Noto Sans TC", sans-serif;
    }

    .card {
      width: min(100%, 420px);
      padding: 38px 28px 30px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 30px;
      background: rgba(255,255,255,.055);
      box-shadow: 0 24px 70px rgba(0,0,0,.35);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      text-align: center;
    }

    .label {
      margin: 0 0 14px;
      color: rgba(255,255,255,.62);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .12em;
    }

    .time {
      margin: 0;
      font-size: clamp(72px, 23vw, 108px);
      line-height: .96;
      font-weight: 750;
      letter-spacing: -.06em;
      font-variant-numeric: tabular-nums;
    }

    .divider {
      width: 44px;
      height: 1px;
      margin: 28px auto 22px;
      background: rgba(255,255,255,.16);
    }

    .countdown {
      min-height: 30px;
      margin: 0;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -.02em;
    }

    .sub {
      margin: 9px 0 0;
      color: rgba(255,255,255,.42);
      font-size: 13px;
    }

    .error {
      color: #ffb4b4;
    }

    @media (max-width: 380px) {
      .card { padding-inline: 20px; }
    }
  </style>
</head>

<body>
  <main class="card">
    <p class="label">TODAY · 下班時間</p>
    <h1 class="time" id="offTime">--:--</h1>

    <div class="divider"></div>

    <p class="countdown" id="countdown">讀取中…</p>
    <p class="sub" id="updated"></p>
  </main>

  <script>
    // Gist 內只需要放 4 碼下班時間，例如：1722
    const GIST_RAW =
      "https://gist.githubusercontent.com/Beidandow/ae9a628b872d72ef0e019324ac6cadae/raw/work_start.txt";

    let offHour = null;
    let offMinute = null;

    function taipeiParts() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Taipei",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23"
      }).formatToParts(new Date());

      return Object.fromEntries(
        parts
          .filter(p => p.type !== "literal")
          .map(p => [p.type, Number(p.value)])
      );
    }

    function renderCountdown() {
      if (offHour === null || offMinute === null) return;

      const now = taipeiParts();
      const nowMinutes = now.hour * 60 + now.minute;
      const offMinutes = offHour * 60 + offMinute;
      const diff = offMinutes - nowMinutes;

      const countdown = document.getElementById("countdown");

      if (diff > 0) {
        const h = Math.floor(diff / 60);
        const m = diff % 60;

        if (h > 0 && m > 0) {
          countdown.textContent = `還有 ${h} 小時 ${m} 分`;
        } else if (h > 0) {
          countdown.textContent = `還有 ${h} 小時`;
        } else {
          countdown.textContent = `還有 ${m} 分`;
        }
      } else if (diff === 0) {
        countdown.textContent = "下班時間到了";
      } else {
        countdown.textContent = "今天下班了";
      }
    }

    async function loadOffTime() {
      const offTime = document.getElementById("offTime");
      const countdown = document.getElementById("countdown");
      const updated = document.getElementById("updated");

      try {
        // 避免瀏覽器/CDN 快取舊值
        const response = await fetch(`${GIST_RAW}?t=${Date.now()}`, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const text = (await response.text()).trim();
        const match = text.match(/^(\d{2})(\d{2})$/);

        if (!match) {
          throw new Error("Gist 格式必須是 4 碼 HHMM");
        }

        const hh = Number(match[1]);
        const mm = Number(match[2]);

        if (hh > 23 || mm > 59) {
          throw new Error("時間格式無效");
        }

        offHour = hh;
        offMinute = mm;

        offTime.textContent =
          `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;

        renderCountdown();

        const now = taipeiParts();
        updated.textContent =
          `更新於 ${String(now.hour).padStart(2, "0")}:${String(now.minute).padStart(2, "0")}`;
        countdown.classList.remove("error");

      } catch (err) {
        offTime.textContent = "--:--";
        countdown.textContent = "暫時無法讀取下班時間";
        countdown.classList.add("error");
        updated.textContent = "";
        console.error(err);
      }
    }

    loadOffTime();

    // 倒數每分鐘更新；Gist 每 30 秒重新抓一次
    setInterval(renderCountdown, 60 * 1000);
    setInterval(loadOffTime, 30 * 1000);
  </script>
</body>
</html>
